services:
  mongo:
    image: mongo:8
    # Every collection and index is a file; the test databases exceed the default 1024.
    ulimits:
      nofile: 64000
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mongo-data:
