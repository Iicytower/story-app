name: story_app

services:
  mongo:
    image: mongo:8
    # Every collection and index is a file; the test databases exceed the default 1024.
    ulimits:
      nofile: 64000
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Tools server (task 54, D56): Coolify deploys services to tools-server, as it will to the real server.
  # Only the "tools" profile starts them; `npm run up` does it, tests and `npm run db:up` do not.
  # Based on Coolify's docker-compose.yml and docker-compose.prod.yml, with project volumes instead of
  # /data/coolify and secrets generated by scripts/tools.ts into .tools/coolify.env.
  coolify:
    profiles: [tools]
    image: docker.io/coollabsio/coolify:4.6.0
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .tools/coolify.env
        required: false
    environment:
      - APP_ENV=production
      - APP_URL=http://localhost:8000
      - PHP_MEMORY_LIMIT=256M
      - PHP_FPM_PM_CONTROL=dynamic
      - PHP_FPM_PM_START_SERVERS=1
      - PHP_FPM_PM_MIN_SPARE_SERVERS=1
      - PHP_FPM_PM_MAX_SPARE_SERVERS=10
      - PUSHER_BACKEND_PORT=6001
    volumes:
      # The image owns storage/app as www-data (9999); a fresh named volume copies that ownership.
      - coolify-storage:/var/www/html/storage/app
    ports:
      - "127.0.0.1:8000:8080"
      - "127.0.0.1:6001:6001"
      - "127.0.0.1:6002:6002"
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health && curl --fail http://127.0.0.1:6001/up || exit 1
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
    depends_on:
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy

  coolify-db:
    profiles: [tools]
    image: postgres:15.19-alpine
    restart: unless-stopped
    env_file:
      - path: .tools/coolify.env
        required: false
    volumes:
      - coolify-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-redis:
    profiles: [tools]
    image: redis:7.4.12-alpine
    restart: unless-stopped
    env_file:
      - path: .tools/coolify.env
        required: false
    command:
      [
        "sh",
        "-c",
        'exec redis-server --save 20 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - coolify-redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10
      timeout: 2s

  tools-server:
    profiles: [tools]
    build: docker/tools-server
    image: story_app-tools-server
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=unix:///var/run/docker.sock"]
    volumes:
      - tools-server-docker:/var/lib/docker
      - tools-server-data:/data
      - type: bind
        source: .tools/ssh/id_ed25519.pub
        target: /run/tools-server/authorized_keys
        read_only: true
    ports:
      # Tools gateway (Caddy with X-Tools-Secret), deployed by Coolify inside this server.
      - "127.0.0.1:8110:8110"

volumes:
  mongo-data:
  coolify-storage:
  coolify-db:
  coolify-redis:
  tools-server-docker:
  tools-server-data:
