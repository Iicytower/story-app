# Tools services deployed by Coolify to the tools server (task 54, D56; LanguageTool: task 29, D58).
# scripts/tools.ts sends this file to Coolify.
# Coolify keeps the first content of a `content:` file; scripts/tools.ts updates changed content
# through the storages API before the restart.
services:
  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "8110:8080"
    environment:
      - TOOLS_API_SECRET=${TOOLS_API_SECRET:?}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        content: |
          {
            admin off
            auto_https off
          }
          :8080 {
            @authorized header X-Tools-Secret {$TOOLS_API_SECRET}
            handle @authorized {
              handle /health {
                respond "ok" 200
              }
              handle_path /lt/* {
                reverse_proxy languagetool:8010
              }
              respond 404
            }
            respond 401
          }

  languagetool:
    image: erikvl87/languagetool:6.8
    restart: unless-stopped
    environment:
      # -Xmx256m checks several times slower; 512m fits the 800m limit (task 29, test on Coolify).
      - Java_Xms=128m
      - Java_Xmx=512m
      # LT stops a check the app has already given up on (PROOFREAD_TIMEOUT_MS).
      - langtool_maxCheckTimeMillis=120000
    mem_limit: 800m
    # Also the warm-up: the first Polish check after a start is several times slower, so the
    # healthcheck makes it before the first user does (D58).
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --output /dev/null --data "language=pl-PL&text=Ala ma kota." http://localhost:8010/v2/check
      interval: 60s
      timeout: 60s
      start_period: 120s
      start_interval: 5s
